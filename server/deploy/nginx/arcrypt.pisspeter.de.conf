##
## Direct relay proxy for arcrypt.pisspeter.de
## - No PHP proxy
## - All /v1/* requests go straight to Node on 127.0.0.1:3000
##

upstream prsm_relay_upstream {
    server 127.0.0.1:3000;
    keepalive 32;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    listen [::]:80;
    server_name arcrypt.pisspeter.de;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name arcrypt.pisspeter.de;

    ssl_certificate /etc/letsencrypt/live/arcrypt.pisspeter.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arcrypt.pisspeter.de/privkey.pem;

    add_header Strict-Transport-Security "max-age=15552000" always;
    client_max_body_size 64k;

    location /v1/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 75s;
        proxy_pass http://prsm_relay_upstream;
    }

    # Explicitly disable legacy php/static fallback routes on this host.
    location / {
        return 404;
    }
}
